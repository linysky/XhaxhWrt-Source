name: Build Xhaxhwrt x86-64 (ImmortalWrt 25.12 APK)

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "ImmortalWrt 版本"
        required: false
        default: "25.12.2"
        type: choice
        options:
          - 25.12.1
          - 25.12.2
      custom_router_ip:
        description: "管理地址（切过来即用，默认与现网一致）"
        required: true
        default: "10.0.0.1"
      profile:
        description: "overlay 大小"
        required: true
        type: choice
        default: '6G'
        options:
          - '4G'
          - '5G'
          - '6G'
      include_docker:
        description: "包含 Docker 全家"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build25.sh ${{ github.workspace }}/shell/*.sh

      - name: Save router IP into firmware files
        run: |
          mkdir -p "${{ github.workspace }}/files/etc/config"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/files/etc/config/custom_router_ip.txt"
          echo "管理地址: ${{ github.event.inputs.custom_router_ip }}"

      - name: Build Xhaxhwrt x86-64 EFI
        run: |
          case "${{ github.event.inputs.profile }}" in
            4G) ROOTFS_SIZE=4096 ;;
            5G) ROOTFS_SIZE=5120 ;;
            6G) ROOTFS_SIZE=6144 ;;
          esac
          luci_version="${{ github.event.inputs.luci_version }}"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$ROOTFS_SIZE \
            -e INCLUDE_DOCKER=${{ github.event.inputs.include_docker }} \
          immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh

      - name: Generate sha256
        run: |
          # ImageBuilder 容器以 root 写出 bin/，先归权给 runner 用户
          sudo chown -R $USER:$USER ${{ github.workspace }}/bin
          cd ${{ github.workspace }}/bin/targets/x86/64
          for f in *squashfs-combined-efi.img.gz; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - name: Create release notes
        run: |
          cat > ${{ github.workspace }}/release-notes.md <<EOF
          ## Xhaxhwrt x86-64 (ImmortalWrt 25.12 APK)
          - 🏠 后台: \`${{ github.event.inputs.custom_router_ip }}\` / root
          - 📦 overlay: ${{ github.event.inputs.profile }}
          - 🐳 Docker: ${{ github.event.inputs.include_docker }}
          - 📋 包清单对齐现网基线（566 包功能闭包）
          EOF

      - name: Upload as release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: autobuild-x86-64-imm
          body_path: ${{ github.workspace }}/release-notes.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
            ${{ github.workspace }}/bin/targets/x86/64/*.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
